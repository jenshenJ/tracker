services:
  db:
    image: postgres:16
    container_name: tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: legko
      POSTGRES_PASSWORD: legko
      POSTGRES_DB: legko
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legko -d legko"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
